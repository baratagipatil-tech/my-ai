
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JARVIS AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #020817;
            color: white;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            height: 100vh;
            max-width: 520px;
            margin: auto;

            display: flex;
            flex-direction: column;

            background:
                radial-gradient(
                    circle at 50% 15%,
                    #12366e 0%,
                    #071936 35%,
                    #020817 75%
                );
        }

        /* HEADER */

        .header {
            height: 85px;

            display: flex;
            align-items: center;

            padding: 15px 20px;

            background: rgba(3, 14, 32, 0.95);

            border-bottom: 1px solid #17477a;
        }

        .avatar {
            width: 52px;
            height: 52px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 27px;

            background: #071d3d;

            border: 2px solid #00c8ff;

            box-shadow:
                0 0 18px #008cff;
        }

        .title {
            margin-left: 13px;
        }

        .title h1 {
            margin: 0;
            font-size: 23px;
        }

        .title p {
            margin: 4px 0 0;

            color: #69bdff;

            font-size: 13px;
        }

        .status {
            margin-left: auto;

            width: 11px;
            height: 11px;

            border-radius: 50%;

            background: #00ff88;

            box-shadow:
                0 0 12px #00ff88;
        }

        /* INTERNET SWITCH */

        .internet-control {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 10px;

            padding: 10px 15px;

            background: rgba(3, 14, 32, 0.95);

            border-bottom: 1px solid #17477a;

            font-size: 13px;
        }

        .internet-label {
            color: #b9d8f5;
        }

        .internet-status {
            min-width: 28px;
            font-weight: bold;
        }

        .internet-status.on {
            color: #00ff88;
        }

        .internet-status.off {
            color: #ff5c7a;
        }

        /* SWITCH */

            position: relative;

            width: 48px;
            height: 26px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
