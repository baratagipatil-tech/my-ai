
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Login</title>

    <style>

        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #111;
            color: white;
        }

        .login-box {

            width: 320px;

            padding: 30px;

            background: #1e1e1e;

            border-radius: 15px;

            text-align: center;

            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #aaa;
        }

        input {

            width: 90%;

            padding: 12px;

            margin-top: 15px;

            border: none;

            border-radius: 8px;

            font-size: 16px;
        }

        button {

            width: 98%;

            padding: 12px;

            margin-top: 15px;

            border: none;

            border-radius: 8px;

            background: #007bff;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .error {

            margin-top: 15px;

            color: #ff5555;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1>🔒 My AI</h1>

        <p>Enter the password to start chatting.</p>

        <form method="POST">

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button type="submit">
                Start AI
            </button>

        </form>

        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}

    </div>

</body>

</html>
